plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.ndk.colored_rectangle'
    compileSdk 36

    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.ndk.colored_rectangle"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    
}

dependencies {
    
}
